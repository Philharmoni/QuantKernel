# Schema fields verified against actual source Parquet; candidate keys are not uniqueness guarantees.
version: 1
tables:
  balancesheet_vip:
    path: balancesheet_vip/**/*.parquet
    purpose: 资产负债表 VIP，全市场按报告期保存。
    primary_key:
    - ts_code
    - end_date
    - report_type
    - ann_date
    - f_ann_date
    date_fields:
    - ann_date
    - f_ann_date
    - end_date
    code_field: ts_code
    required_fields:
    - ts_code
    - end_date
    - report_type
    - ann_date
    - f_ann_date
    - update_flag
    - total_assets
    stage1: true
    notes: 33期20180630至20260630；保留版本冲突与ann_date/f_ann_date，不保证候选键唯一。total_assets等为时点余额，不做累计差分/TTM求和；20260630分区仅1行，保留缺失而不补造。
      全量画像发现31组相同候选键对应不同完整记录；financial_available按完整记录哈希保留版本。同一生效日、报告期、字段存在冲突时标ambiguous并留空，不用update_flag任意择一。 财务旧代码与当前stock_basic不能全部匹配；原始代码和记录保留，不以内连接丢弃或编造历史代码映射。
  block_trade:
    path: block_trade/**/*.parquet
    purpose: 大宗交易，按交易日分区。
    primary_key: []
    date_fields:
    - trade_date
    code_field: ts_code
    required_fields:
    - trade_date
    - ts_code
    stage1: false
    notes: 路径及日期/代码字段已由真实首文件schema确认；未用于本阶段派生，主键尚未确认。代码字段保留源含义，不保证表示A股股票。
  broker_recommend:
    path: broker_recommend/**/*.parquet
    purpose: 券商月度金股，按月份保存；官方单次最大 1000 行。
    primary_key: []
    date_fields: []
    code_field: ts_code
    required_fields:
    - ts_code
    stage1: false
    notes: 路径及日期/代码字段已由真实首文件schema确认；未用于本阶段派生，主键尚未确认。代码字段保留源含义，不保证表示A股股票。 月/季度列month保留原字段，不作为YYYYMMDD日字段解析。
