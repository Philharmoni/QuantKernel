version: 2
scope: step_0_through_step_4
mode: reuse_existing_declared_dependencies_no_new_packages
inherits:
  project_manifest: pyproject.toml
  lock_file: requirements-lock.txt
solver:
  package: numpy
  version: 1.26.4
  algorithm: dykstra_halfspace_projection
  algorithm_version: 1
  max_cycles: 2000
  feasibility_tolerance: '1e-10'
  change_tolerance: '1e-12'
  scipy_required: false
  reason: deterministic_euclidean_projection_onto_frozen_linear_constraints
future_change:
  requires_new_stage3_dependency_file: true
  modify_stage1_stage2_dependency_identity: false
